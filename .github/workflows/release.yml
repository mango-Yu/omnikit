# 推送版本 tag（如 v0.1.0）后自动打包，并发布带安装包的 GitHub Release
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v0.2.0）。留空则用 package.json 版本；不存在则基于当前分支创建'
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 一个通用 DMG（Intel + Apple Silicon），两份 ffmpeg 按运行时架构选取
          - platform: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            ffmpeg_targets: macos-arm64 macos-x86_64
          # 一个 Windows 安装包 EXE
          - platform: windows-latest
            args: --bundles nsis
            ffmpeg_targets: windows-x86_64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      # 二进制不进 git；打包前按平台下载，Tauri 会拷进 resources/ffmpeg/
      - name: Download bundled FFmpeg
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          for t in ${{ matrix.ffmpeg_targets }}; do
            echo "::group::ffmpeg $t"
            npm run ffmpeg:download -- --target="$t"
            echo "::endgroup::"
          done
          ls -lh resources/ffmpeg/

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            if [ -z "$TAG" ]; then
              TAG="v$(node -p "require('./package.json').version")"
            fi
          else
            TAG="${{ github.ref_name }}"
          fi
          if [[ "$TAG" != v* ]]; then
            TAG="v$TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "resolved tag=$TAG"

      - name: Build and upload to GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.meta.outputs.tag }}
          releaseName: OmniKit ${{ steps.meta.outputs.tag }}
          releaseCommitish: ${{ github.sha }}
          releaseBody: |
            ## 下载安装

            - **macOS**：`OmniKit_*_universal.dmg`（Intel / Apple Silicon 通用）
            - **Windows**：`OmniKit_*-setup.exe`

            macOS 若提示「已损坏」，请参考 README 中的 `xattr` 处理说明。
            录屏：开发版和安装包要分别授权；勾选后必须 Command+Q 退出再打开。
          # 直接正式发布，Assets 中会出现 .dmg / .exe（不是源码 zip）
          releaseDraft: false
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          args: ${{ matrix.args }}
